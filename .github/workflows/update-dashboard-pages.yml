name: Update Water Dashboard Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WATER_QUALITY_DATA_DIR: ${{ github.workspace }}/water_quality_data
      GITHUB_PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore historical water data cache
        uses: actions/cache@v4
        with:
          path: |
            water_quality_data/water_quality_records.csv
            water_quality_data/run_archives
            water_quality_data/daily_outputs/*/runs
          key: water-quality-data-${{ github.run_id }}
          restore-keys: |
            water-quality-data-

      - name: Verify dashboard support datasets
        run: |
          test -s ai_water_guard_agent/dashboard_static_data/historical_annual_station_measurements.csv
          test -s ai_water_guard_agent/dashboard_static_data/south_korea_water_quality_station_metadata.csv
          test -s ai_water_guard_agent/dashboard_static_data/download_manifest.json
          test -s ai_water_guard_agent/algal_bloom_data/cyanobacteria_station_cells_per_ml.csv
          test -s ai_water_guard_agent/algal_bloom_data/harmful_cyanobacteria_lakewide_cells_per_ml.csv
          test -s ai_water_guard_agent/algal_bloom_data/namgang_station_latlon.csv
          test -s ai_water_guard_agent/watershed_shapes/korea_major_subbasins/korea_major_subbasins.shp
          test -s ai_water_guard_agent/HSPF_Algae_Bloom_SKorea/05_analysis/algae_scenarios/observed_chla_scenario_screening.csv
          test -s ai_water_guard_agent/HSPF_Algae_Bloom_SKorea/05_analysis/algae_scenarios/hspf_plnk_2010_scenario_summary.csv
          python - <<'PY'
          from pathlib import Path
          files = [
              Path("ai_water_guard_agent/dashboard_static_data/historical_annual_station_measurements.csv"),
              Path("ai_water_guard_agent/dashboard_static_data/south_korea_water_quality_station_metadata.csv"),
              Path("ai_water_guard_agent/dashboard_static_data/download_manifest.json"),
              Path("ai_water_guard_agent/algal_bloom_data/cyanobacteria_station_cells_per_ml.csv"),
              Path("ai_water_guard_agent/algal_bloom_data/harmful_cyanobacteria_lakewide_cells_per_ml.csv"),
              Path("ai_water_guard_agent/algal_bloom_data/namgang_station_latlon.csv"),
              Path("ai_water_guard_agent/watershed_shapes/korea_major_subbasins/korea_major_subbasins.shp"),
              Path("ai_water_guard_agent/HSPF_Algae_Bloom_SKorea/05_analysis/algae_scenarios/observed_chla_scenario_screening.csv"),
              Path("ai_water_guard_agent/HSPF_Algae_Bloom_SKorea/05_analysis/algae_scenarios/hspf_plnk_2010_scenario_summary.csv"),
          ]
          for path in files:
              print(f"{path}: {path.stat().st_size:,} bytes")
          PY

      - name: Generate latest dashboard
        env:
          REQUIRE_DASHBOARD_SUPPORT_DATA: "1"
        run: python ai_water_guard_agent/AI_Water_Guard_Agent.py

      - name: Validate generated dashboard record health
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          data_dir = Path("water_quality_data")
          csv_path = data_dir / "water_quality_records.csv"
          if not csv_path.exists():
              raise SystemExit("water_quality_records.csv was not generated")
          df = pd.read_csv(csv_path)
          if "timestamp" not in df.columns:
              raise SystemExit("timestamp column is missing from water_quality_records.csv")
          df["timestamp"] = pd.to_datetime(df["timestamp"], errors="coerce")
          latest_day = df["timestamp"].dt.strftime("%Y-%m-%d").dropna().max()
          latest = df[df["timestamp"].dt.strftime("%Y-%m-%d") == latest_day].copy()
          record_count = len(latest)
          station_cols = [c for c in ["station_identity", "station_code", "station_name", "display_location"] if c in latest.columns]
          station_count = latest[station_cols[0]].astype(str).nunique() if station_cols else 0
          if record_count < 1000 or station_count < 100:
              raise SystemExit(
                  f"Refusing to deploy weak dashboard batch for {latest_day}: "
                  f"{record_count} records, {station_count} stations"
              )
          print(f"Dashboard record-health check passed: {latest_day}, {record_count:,} records, {station_count:,} stations")
          PY

      - name: Prepare GitHub Pages artifact
        run: |
          test -f "$WATER_QUALITY_DATA_DIR/google_site_dashboard/index.html"
          cp -R "$WATER_QUALITY_DATA_DIR/google_site_dashboard" site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
