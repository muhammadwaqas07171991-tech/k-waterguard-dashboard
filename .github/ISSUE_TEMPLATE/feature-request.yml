name: Feature Request
description: Suggest a dashboard, analysis, automation, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Or Opportunity
      description: What user need or research workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Improvement
      description: Describe the dashboard page, plot, data download, API, or automation change.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Intended Users
      description: Farmers, researchers, watershed managers, policy experts, lake/reservoir operators, or other groups.
